services:
  - type: web
    name: smartpay-backend
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8765
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false

  - type: static_site
    name: smartpay-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
